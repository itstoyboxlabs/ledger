name: CI

# Runs on pull requests and on pushes to main. It uses `pull_request`, never `pull_request_target`,
# so code from a fork never runs with write access or secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, unit tests and the production build run together in one job.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  # The browser tests are split into four shards that run at the same time.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: app/test-results
          retention-days: 7

  # One required check for branch protection: it passes only when every job above passed.
  test:
    name: test
    needs: [check, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.check.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}, e2e: ${{ needs.e2e.result }}"
            exit 1
          fi

  # Ships the site to Vercel after the tests pass on main. It only runs for pushes to main, so a pull request
  # from a fork never reaches it, and fork runs never see the secret.
  deploy:
    name: deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the token shape
        run: |
          t=$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')
          echo "length: ${#t}"
          [[ "$t" =~ ^[A-Za-z0-9_]+$ ]] && echo "shape: ok" || { echo "shape: not a plain token"; exit 1; }
      - run: npx --yes vercel@65.12.1 deploy --prod --yes --token "$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')"
      - run: node scripts/indexnow.mjs
